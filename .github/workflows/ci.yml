name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -tags=webkit2_41
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', '1.26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/dockstar-ui/frontend/package-lock.json
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm --prefix cmd/dockstar-ui/frontend ci
      - run: npm --prefix cmd/dockstar-ui/frontend run build
      - run: go mod download
      - run: go test ./...
      - run: go test -race ./internal/...
      - run: go vet ./...
      - run: make build

  quality:
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/dockstar-ui/frontend/package-lock.json
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm --prefix cmd/dockstar-ui/frontend ci
      - run: npm --prefix cmd/dockstar-ui/frontend run build
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check generated bindings
        run: go generate ./internal/protocol && git diff --exit-code
      - name: Check Markdown
        run: npx --yes markdownlint-cli2@0.23.1 '**/*.md'
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest $(go list ./... | grep -v '/internal/protocol$')
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/dockstar-ui/frontend/package-lock.json
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm --prefix cmd/dockstar-ui/frontend ci
      - run: npm --prefix cmd/dockstar-ui/frontend run build
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        # The snapshot emits SBOMs just like a tagged release.
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
